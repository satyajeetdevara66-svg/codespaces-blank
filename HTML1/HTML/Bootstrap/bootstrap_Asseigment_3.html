<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  
  <style>
    .login {
      margin-left: 35%;
      margin-right: 40%;
    }
    .p {
      margin-left: 35%;
    }
    .button {
      border: none;
      border-radius: 6px;
      background: blue;
      height: 30px;
      width: 100%;
      color: white;
      
    }
  </style>
</head>
<body>
        
  <!-- First Navbar (Logo + Links + Login/Sign-up buttons) -->
  <nav class="navbar navbar-default">
    <div class="container-fluid">
      <!-- Logo -->
      <div class="navbar-header">
        <a class="navbar-brand" href="https://codelib.in/">
          <img src="bootstrap.jpeg" height="40" width="40" alt="Logo">
        </a>
      </div>

      <!-- Left side links -->
       <center>
      <ul class="nav nav-pills">
        <li><a href="#">Home</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">FAQs</a></li>
        <li><a href="#">About</a></li>
      </ul>
      </center>

      <!-- Right side: Login + Sign-up as buttons -->
      <ul class="nav navbar-nav navbar-right">
        <li>
          <button class="btn btn-primary navbar-btn">Login</button>
        </li>
        <li>
          <button class="btn btn-success navbar-btn">Sign Up</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Second Navbar (Dark with Always expand + Home/Link + Search) -->
  <nav class="navbar navbar-inverse">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="#">Always expand</a>
      </div>
      <ul class="nav navbar-nav">
        <li class="active"><a href="#">Home</a></li>
        <li><a href="#">Link</a></li>
      </ul>

      <!-- Search bar -->
      <form class="navbar-form navbar-right" role="search">
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Search">
        </div>
        <button type="submit" class="btn btn-default">Search</button>
      </form>
    </div>
  </nav>

  <!-- Login Window -->
  <nav>        
    <center><h1>Login Window</h1></center>
    <div class="login">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" class="form-control" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Enter password">
      </div>
      <div class="checkbox">
        <label><input type="checkbox"> Remember me</label>
      </div>
      <button class="button">Login</button>
      <center>
        <p>Please Register Yourself? <a href="#"><u>Sign Up</u></a></p>
        <p><a href="#">Forget Password?</a></p>
      </center>
    </div>
    <hr>
    <footer>
      <a href="https://codelib.in/"><img src="bootstrap.jpeg" height="40" width="40"></a>
      © 2023 Company, Inc
    </footer>
  </nav>
</body>
</html>
